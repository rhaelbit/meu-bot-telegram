version: "3.8"

services:
  # ============================================
  # POSTGRESQL - Banco de dados principal
  # ============================================
  postgres:
    image: postgres:15-alpine
    container_name: monitor_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secret_123}
      POSTGRES_DB: chatwoot_production
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    networks:
      - monitor_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # REDIS - Cache e filas
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: monitor_redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secret_123}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - monitor_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret_123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # EVOLUTION API - Conexão WhatsApp
  # ============================================
  evolution-api:
    image: atendai/evolution-api:v2.2.3
    container_name: monitor_evolution
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Server
      SERVER_URL: ${EVOLUTION_SERVER_URL:-http://localhost:8080}
      SERVER_PORT: 8080

      # Auth
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-SUA_CHAVE_API_AQUI}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"

      # Database
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secret_123}@postgres:5432/evolution?schema=public

      # Redis
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://default:${REDIS_PASSWORD:-redis_secret_123}@redis:6379/0

      # Chatwoot Integration
      CHATWOOT_ENABLED: "true"
      CHATWOOT_ACCOUNT_ID: ${CHATWOOT_ACCOUNT_ID:-1}
      CHATWOOT_TOKEN: ${CHATWOOT_TOKEN:-TOKEN_DO_CHATWOOT}
      CHATWOOT_URL: ${CHATWOOT_URL:-http://chatwoot:3000}
      CHATWOOT_SIGN_MSG: "false"
      CHATWOOT_REOPEN_CONVERSATION: "true"
      CHATWOOT_CONVERSATION_PENDING: "false"
      CHATWOOT_IMPORT_CONTACTS: "true"
      CHATWOOT_NAME_INBOX: "evolution"
      CHATWOOT_AUTO_CREATE: "true"

      # Webhook (para capturar TODAS as mensagens)
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: ""
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      WEBHOOK_EVENTS_APPLICATION_STARTUP: "false"
      WEBHOOK_EVENTS_QRCODE_UPDATED: "true"
      WEBHOOK_EVENTS_MESSAGES_SET: "true"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_MESSAGES_UPDATE: "true"
      WEBHOOK_EVENTS_MESSAGES_DELETE: "true"
      WEBHOOK_EVENTS_SEND_MESSAGE: "true"
      WEBHOOK_EVENTS_CONTACTS_SET: "true"
      WEBHOOK_EVENTS_CONTACTS_UPSERT: "true"
      WEBHOOK_EVENTS_CONTACTS_UPDATE: "true"
      WEBHOOK_EVENTS_PRESENCE_UPDATE: "true"
      WEBHOOK_EVENTS_CHATS_SET: "true"
      WEBHOOK_EVENTS_CHATS_UPSERT: "true"
      WEBHOOK_EVENTS_CHATS_UPDATE: "true"
      WEBHOOK_EVENTS_CHATS_DELETE: "true"
      WEBHOOK_EVENTS_GROUPS_UPSERT: "true"
      WEBHOOK_EVENTS_GROUPS_UPDATE: "true"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"

      # Instancias
      DEL_INSTANCE: "false"

      # Logs
      LOG_LEVEL: WARN

    volumes:
      - evolution_instances:/evolution/instances
    ports:
      - "8080:8080"
    networks:
      - monitor_network

  # ============================================
  # CHATWOOT - Painel de monitoramento
  # ============================================
  chatwoot-rails:
    image: chatwoot/chatwoot:v3.14.1
    container_name: monitor_chatwoot
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Rails
      RAILS_ENV: production
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-GERE_UMA_CHAVE_SECRETA_AQUI_COM_64_CARACTERES_HEX}
      FRONTEND_URL: ${CHATWOOT_FRONTEND_URL:-http://localhost:3000}
      DEFAULT_LOCALE: pt_BR

      # Database
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USERNAME: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secret_123}
      POSTGRES_DATABASE: chatwoot_production

      # Redis
      REDIS_URL: redis://default:${REDIS_PASSWORD:-redis_secret_123}@redis:6379/1

      # Mailer (opcional - pode configurar depois)
      MAILER_SENDER_EMAIL: ${MAILER_SENDER_EMAIL:-noreply@seudominio.com}
      SMTP_DOMAIN: ${SMTP_DOMAIN:-seudominio.com}
      SMTP_ADDRESS: ${SMTP_ADDRESS:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTHENTICATION: login
      SMTP_ENABLE_STARTTLS_AUTO: "true"

      # Storage (local por padrão)
      ACTIVE_STORAGE_SERVICE: local

      # Misc
      ENABLE_ACCOUNT_SIGNUP: "false"
      LOG_LEVEL: warn

    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    volumes:
      - chatwoot_storage:/app/storage
      - chatwoot_public:/app/public
    ports:
      - "3000:3000"
    networks:
      - monitor_network

  # ============================================
  # CHATWOOT SIDEKIQ - Background jobs
  # ============================================
  chatwoot-sidekiq:
    image: chatwoot/chatwoot:v3.14.1
    container_name: monitor_chatwoot_worker
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      RAILS_ENV: production
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-GERE_UMA_CHAVE_SECRETA_AQUI_COM_64_CARACTERES_HEX}
      FRONTEND_URL: ${CHATWOOT_FRONTEND_URL:-http://localhost:3000}
      DEFAULT_LOCALE: pt_BR
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USERNAME: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secret_123}
      POSTGRES_DATABASE: chatwoot_production
      REDIS_URL: redis://default:${REDIS_PASSWORD:-redis_secret_123}@redis:6379/1
      ACTIVE_STORAGE_SERVICE: local
      ENABLE_ACCOUNT_SIGNUP: "false"
      LOG_LEVEL: warn
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    volumes:
      - chatwoot_storage:/app/storage
    networks:
      - monitor_network

# ============================================
# VOLUMES
# ============================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  evolution_instances:
    driver: local
  chatwoot_storage:
    driver: local
  chatwoot_public:
    driver: local

# ============================================
# NETWORKS
# ============================================
networks:
  monitor_network:
    driver: bridge
